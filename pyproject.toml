[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classbot"
version = "0.1.0"
description = "Classbot classroom assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
    "qasync>=0.27,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "python-dotenv>=1.0,<2",
    "sounddevice>=0.4,<1",
    "webrtcvad-wheels>=2.0,<3",
    "PyAudioWPatch>=0.2.12,<0.3; sys_platform == 'win32'",
    "soxr>=0.5,<2",
    "python-docx>=1.1,<2",
    "pypdf>=5,<7",
    "fonttools>=4.50,<5",
    "PyMuPDF>=1.24,<2",
    "python-pptx>=1,<2",
    "transformers>=4.40,<6",
]

[project.optional-dependencies]
asr = [
    "funasr>=1.1,<2",
    # 2.7 is the first torch line usable on NVIDIA Blackwell (RTX 50) GPUs.
    "torch>=2.7,<3",
    "torchaudio>=2.7,<3",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6,<1",
]

[project.scripts]
classbot = "classbot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
